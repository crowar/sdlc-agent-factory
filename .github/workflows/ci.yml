name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  commit-convention:
    name: Commit convention
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            if [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then
              revision="$HEAD_SHA"
            else
              base="$(git merge-base "origin/$DEFAULT_BRANCH" "$HEAD_SHA")"
              revision="$base..$HEAD_SHA"
            fi
          else
            revision="$BASE_SHA..$HEAD_SHA"
          fi

          .github/scripts/check-commit-messages.sh "$revision"

  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Bash syntax
        shell: bash
        run: |
          for script in scripts/*.sh .github/scripts/*.sh; do
            bash -n "$script"
          done

      - name: Validate Codex SDLC contract
        run: ./scripts/validate-sdlc.sh

      - name: Smoke-test Bash installer
        env:
          SDLC_INSTALL_HOME: ${{ runner.temp }}/installer-home
        run: ./scripts/install-global.sh all --dry-run

      - name: Smoke-test Codex installation topology
        run: |
          export SDLC_INSTALL_HOME="$(mktemp -d)"
          ./scripts/install-global.sh codex
          test -f "$SDLC_INSTALL_HOME/.agents/skills/autonomous-sdlc/SKILL.md"
          test -f "$SDLC_INSTALL_HOME/.agents/skills/autonomous-sdlc/references/subagent-routing.md"
          test -f "$SDLC_INSTALL_HOME/.agents/skills/autonomous-sdlc/references/role-routing.md"
          test -f "$SDLC_INSTALL_HOME/.agents/skills/autonomous-sdlc/references/roles/architect.agent.md"
          test ! -e "$SDLC_INSTALL_HOME/.agents/skills/backend-dev/SKILL.md"

      - name: Validate and smoke-test PowerShell installer
        shell: pwsh
        env:
          SDLC_INSTALL_HOME: ${{ runner.temp }}/installer-home
        run: ./scripts/install-global.ps1 -Provider all -DryRun

      - name: Smoke-test PowerShell Codex installation topology
        shell: pwsh
        run: |
          $env:SDLC_INSTALL_HOME = Join-Path $env:RUNNER_TEMP "codex-pwsh-home"
          ./scripts/install-global.ps1 -Provider codex
          if (-not (Test-Path -LiteralPath (Join-Path $env:SDLC_INSTALL_HOME ".agents/skills/autonomous-sdlc/SKILL.md") -PathType Leaf)) { throw "Missing autonomous-sdlc skill" }
          if (-not (Test-Path -LiteralPath (Join-Path $env:SDLC_INSTALL_HOME ".agents/skills/autonomous-sdlc/references/role-routing.md") -PathType Leaf)) { throw "Missing role routing" }
          if (-not (Test-Path -LiteralPath (Join-Path $env:SDLC_INSTALL_HOME ".agents/skills/autonomous-sdlc/references/roles/architect.agent.md") -PathType Leaf)) { throw "Missing architect role brief" }
          if (Test-Path -LiteralPath (Join-Path $env:SDLC_INSTALL_HOME ".agents/skills/backend-dev/SKILL.md")) { throw "Role was incorrectly installed as a skill" }
