name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  commit-convention:
    name: Commit convention
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            if [[ "$REF_NAME" == "$DEFAULT_BRANCH" ]]; then
              revision="$HEAD_SHA"
            else
              base="$(git merge-base "origin/$DEFAULT_BRANCH" "$HEAD_SHA")"
              revision="$base..$HEAD_SHA"
            fi
          else
            revision="$BASE_SHA..$HEAD_SHA"
          fi

          .github/scripts/check-commit-messages.sh "$revision"

  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Bash syntax
        shell: bash
        run: |
          for script in scripts/*.sh .github/scripts/*.sh; do
            bash -n "$script"
          done

      - name: Smoke-test Bash installer
        env:
          HOME: ${{ runner.temp }}/installer-home
        run: ./scripts/install-global.sh all --dry-run

      - name: Validate and smoke-test PowerShell installer
        shell: pwsh
        env:
          HOME: ${{ runner.temp }}/installer-home
        run: ./scripts/install-global.ps1 -Provider all -DryRun
